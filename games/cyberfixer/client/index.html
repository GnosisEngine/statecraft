<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Cyber Fixer</title>
  <style>
    body { font-family: system-ui, sans-serif; background: #0b0e14; color: #d8e0f0; margin: 2rem; }
    h1 { color: #7ee0ff; }
    .turn-banner { font-size: 1.1rem; font-weight: 600; padding: 0.6rem 1rem; border-radius: 6px; margin-top: 0.75rem; display: inline-block; }
    .turn-banner.my-turn { background: #1a4d2e; color: #8fe0a0; border: 1px solid #2e7d4f; }
    .turn-banner.their-turn { background: #2a2a2a; color: #999; border: 1px solid #444; }
    .hint { font-size: 0.85rem; color: #8899bb; margin-top: 0.4rem; min-height: 1.2em; }
    .board { display: flex; gap: 2rem; margin-top: 1rem; transition: opacity 0.2s; }
    .board.not-my-turn { opacity: 0.6; }
    .fixer { border: 1px solid #2a3550; border-radius: 8px; padding: 1rem; min-width: 260px; }
    .fixer.active-fixer { border-color: #2e7d4f; }
    .fixer h2 { margin-top: 0; font-size: 1rem; color: #9fd8ff; }
    .metric { font-size: 0.85rem; color: #8fa; }
    .card { border: 1px solid #2a3550; border-radius: 6px; padding: 0.5rem; margin: 0.4rem 0; cursor: default; }
    .card.targetable { cursor: pointer; border-color: #3a5a8a; }
    .card.targetable:hover { border-color: #7ee0ff; }
    .card.selected { border-color: #7ee0ff; background: #142032; }
    .card.defeated { opacity: 0.4; }
    .tag { display: inline-block; font-size: 0.7rem; color: #aaa; border: 1px solid #333; border-radius: 3px; padding: 0 4px; margin-right: 4px; }
    button { background: #1a2740; color: #d8e0f0; border: 1px solid #3a4a70; border-radius: 6px; padding: 0.5rem 1rem; cursor: pointer; margin-right: 0.5rem; }
    button:disabled { opacity: 0.4; cursor: default; }
    #log { margin-top: 1.5rem; font-size: 0.85rem; color: #9fb; white-space: pre-wrap; max-height: 200px; overflow-y: auto; }
    #chat { margin-top: 1.5rem; border: 1px solid #2a3550; border-radius: 8px; padding: 0.75rem; max-width: 400px; }
    #chat h3 { margin: 0 0 0.5rem 0; font-size: 0.9rem; color: #9fd8ff; }
    #chat-log { max-height: 150px; overflow-y: auto; font-size: 0.85rem; margin-bottom: 0.5rem; }
    #chat-log div { margin: 0.15rem 0; }
    #chat-log .who { color: #7ee0ff; font-weight: 600; }
    #chat-form { display: flex; gap: 0.4rem; }
    #chat-input { flex: 1; background: #0f1420; color: #d8e0f0; border: 1px solid #3a4a70; border-radius: 6px; padding: 0.4rem 0.6rem; }
  </style>
</head>
<body>
  <h1>Cyber Fixer</h1>
  <div id="status">connecting…</div>
  <div id="turn-banner" class="turn-banner"></div>
  <div id="hint" class="hint"></div>
  <div class="board" id="board"></div>
  <div>
    <button id="ready-btn">Ready</button>
    <button id="shakedown-btn" disabled>Shakedown selected target</button>
    <button id="end-turn-btn" disabled>End turn</button>
  </div>
  <div id="log"></div>

  <div id="chat">
    <h3>Chat</h3>
    <div id="chat-log"></div>
    <form id="chat-form">
      <input id="chat-input" type="text" placeholder="Say something…" maxlength="500" />
      <button type="submit">Send</button>
    </form>
  </div>

  <script src="/vendor/colyseus.js"></script>
  <script src="main.js"></script>
</body>
</html>
